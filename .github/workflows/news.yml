name: Update news
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: >-
          python news/fetch_news.py --out docs/news.json
          --previous-url https://kazirafsanmahboob29-create.github.io/krm-after-hours-news/news.json
      - name: Fetch New England grid demand
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python news/fetch_grid.py --out docs/grid.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy headlines
        id: deployment
        uses: actions/deploy-pages@v4
